<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>The Song of the Red Rocks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
    body { 
        background: #1a1a1a; 
        color: white; 
        text-align: center; 
        font-family: sans-serif; 
        margin: 0; 
        padding: 10px; /* Reduced for mobile screens */
    }
    .book-container { 
        width: 100%; /* Allows it to expand to the edges */
        max-width: 1200px; /* Increased slightly for larger monitors */
        margin: auto; 
    }
    img { 
        width: 100%; 
        max-width: 100%; /* Ensures it never overflows the screen */
        height: auto; 
        margin-bottom: 20px; /* Tighter gap for better flow */
        border: 2px solid #333; /* Thinner border for small screens */
        box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
        display: block; /* Removes any tiny bottom gaps */
    }
    h1 { margin-bottom: 20px; color: #ff4500; font-size: 1.5rem; }
/* Existing styles above... */

   @media (max-width: 600px) {
        body {
            padding: 0px;    /* Remove all side spacing */
            margin: 0px;     /* Ensure no gaps at the edges */
            background-color: #000; /* Black background makes colors pop */
        }
        .book-container {
            width: 100%;     /* Use the full width of the phone */
            max-width: none; /* Let it stretch edge-to-edge */
        }
        img {
            width: 100vw;    /* Make the image exactly the width of the screen */
            height: auto;    /* Keep it from getting squished */
            margin-bottom: 10px; /* Tighter gap between pages */
            display: block;  /* Remove any tiny "ghost" gaps */
        }
    }
</style>
</head>
<body>
    <h1 style="display: none;">The Song of the Red Rocks</h1>
    <div class="book-container">
        <img src="cover.jpeg">
        <img src="index-2_1.png">
        <img src="index-3_1.png">
        <img src="index-4_1.png">
        <img src="index-5_1.png">
        <img src="index-6_1.png">
        <img src="index-7_1.png">
        <img src="index-8_1.png">
        <img src="index-9_1.png">
        <img src="index-10_1.png">
    </div>
    <p>The End</p>
</body>
</html>
